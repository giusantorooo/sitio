# Panel de contenidos de giusantoro.com (Sveltia CMS).
# Los campos de aquí corresponden 1:1 a content/textos.json y content/archivo.json.
# Si se añade o se quita un texto en el sitio, hay que cambiarlo también aquí,
# si no el panel y el sitio dejan de coincidir.

backend:
  name: github
  repo: giusantorooo/sitio
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: textos
    label: Testi del sito
    files:
      - name: general
        label: Testi (home, gioielleria, ceramica, sobre mí, contatto)
        file: content/textos.json
        fields:
          - { name: home_titulo, label: "Home — titolo", widget: string }
          - { name: home_sub, label: "Home — riga sotto il titolo", widget: string }
          - { name: home_joyeria, label: "Home — riga Joyería", widget: text }
          - { name: home_ceramica, label: "Home — riga Cerámica", widget: text }

          - { name: joyeria_intro, label: "Joyería — riga sotto il titolo", widget: string }
          - name: joyeria_servicios
            label: "Joyería — servizi"
            label_singular: Servizio
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Titolo, widget: string }
              - { name: linea, label: "Riga corta blu (facoltativa)", widget: string, required: false }
              - { name: texto, label: Testo, widget: text }
          - name: joyeria_nota
            label: "Joyería — note sotto i servizi (facoltative)"
            label_singular: Nota
            widget: list
            required: false
            field: { name: nota, label: Nota, widget: text }

          - { name: ceramica_intro, label: "Cerámica — riga sotto il titolo", widget: string }
          - name: ceramica_servicios
            label: "Cerámica — servizi"
            label_singular: Servizio
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Titolo, widget: string }
              - { name: linea, label: "Riga corta blu (facoltativa)", widget: string, required: false }
              - { name: texto, label: Testo, widget: text }
          - name: ceramica_nota
            label: "Cerámica — note sotto i servizi (facoltative)"
            label_singular: Nota
            widget: list
            required: false
            field: { name: nota, label: Nota, widget: text }

          - name: sobre_parrafos
            label: "Sobre mí — paragrafi"
            label_singular: Paragrafo
            widget: list
            field: { name: parrafo, label: Paragrafo, widget: text }

          - { name: contacto_intro, label: "Contacto — testo", widget: text }
          - { name: pie_cta, label: "Fondo pagina — domanda sopra il pulsante", widget: string }
          - { name: email, label: Email, widget: string }
          - { name: instagram, label: "Instagram (senza @)", widget: string }
          - { name: whatsapp, label: "WhatsApp (con prefisso, es. +34 600 000 000; vuoto = non compare)", widget: string, required: false }

  - name: archivo
    label: Progetti
    files:
      - name: piezas
        label: Progetti
        file: content/archivo.json
        fields:
          - name: piezas
            label: Progetti
            label_singular: Progetto
            widget: list
            summary: "{{fields.titulo}}"
            hint: "L'ordine qui è l'ordine sul sito. Trascina per spostare."
            fields:
              - { name: titulo, label: Titolo, widget: string }
              - name: material
                label: Materiale
                widget: select
                multiple: true
                options: ["Cerámica", "Joyería"]
              - name: secciones
                label: "Pagine dove compare (facoltativo)"
                widget: select
                multiple: true
                required: false
                options: ["Cerámica", "Joyería"]
                hint: "Vuoto = compare nelle pagine del suo materiale."
              - name: cliente
                label: "Cliente (facoltativo)"
                widget: string
                required: false
                hint: "Pieno = etichetta «Cliente: …». Vuoto = «Proyecto propio»."
              - name: contexto
                label: Contesto
                widget: select
                options: ["Encargo", "Personal", "Marca propia"]
              - name: trabajo
                label: "Lavorazioni (separate da virgola)"
                widget: list
                hint: "Es.: Modelo, Molde, Escultura"
              - { name: anio, label: Anno, widget: string, hint: "Es.: 2023, oppure 2021 – 2024" }
              - { name: portada, label: Foto di copertina, widget: image, required: false }
              - name: galeria
                label: Galleria
                widget: list
                required: false
                field: { name: foto, label: Foto, widget: image }
              - name: cuerpo
                label: Descrizione
                widget: text
                hint: "Per il grassetto: **così**. Lascia una riga vuota tra i paragrafi."
